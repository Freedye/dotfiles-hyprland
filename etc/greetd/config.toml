# /etc/greetd/config.toml — lain greeter (Quickshell inside a minimal Hyprland)
[terminal]
vt = 1

[default_session]
# systemd-cat: greeter output goes to the journal (tag "lain-greeter"), not on the VT.
command = "systemd-cat -t lain-greeter start-hyprland -- -c /etc/greetd/hyprland.lua"
user = "greeter"

# No [initial_session]: no autologin, the password is always asked.
